*{-webkit-tap-highlight-color:transparent}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-120deg)}}
#main.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#main.enter>:nth-child(2){animation-delay:.05s}#main.enter>:nth-child(3){animation-delay:.1s}#main.enter>:nth-child(4){animation-delay:.15s}#main.enter>:nth-child(5){animation-delay:.2s}#main.enter>:nth-child(6){animation-delay:.25s}#main.enter>:nth-child(7){animation-delay:.3s}#main.enter>:nth-child(8){animation-delay:.35s}#main.enter>:nth-child(n+9){animation-delay:.4s}
#main.enter>#ls{animation:none}
#main.enter #ls .it{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#main.enter #ls .it:nth-child(3){animation-delay:.04s}#main.enter #ls .it:nth-child(4){animation-delay:.08s}#main.enter #ls .it:nth-child(5){animation-delay:.12s}#main.enter #ls .it:nth-child(6){animation-delay:.16s}#main.enter #ls .it:nth-child(7){animation-delay:.2s}#main.enter #ls .it:nth-child(n+8){animation-delay:.24s}
#main.enter .hero .bar i,#main.enter .rk .bar i,#main.enter .stk i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
#main.enter .col i{transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.8,.2,1) .15s both}
#main.enter .ring{animation:pop .8s cubic-bezier(.2,.8,.2,1) .1s both}
button,.it,.stat,.chip{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s,box-shadow .25s,opacity .25s}
button:active,.it:active,.stat:active{transform:scale(.96)}
.qa button:active{transform:scale(.92)}
nav button{position:relative}
nav button i{display:inline-block;transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s}

nav button:not(.fab)::after{content:"";position:absolute;bottom:-1px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--p);transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}

.mask{display:flex;visibility:hidden;opacity:0;transition:opacity .28s,visibility 0s .28s}
.mask.on{visibility:visible;opacity:1;transition:opacity .28s}
.sheet{transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.mask.on .sheet{transform:none}
#lb img{transform:scale(.88);transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.toast{display:block;opacity:0;transform:translate(-50%,-14px);transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}

<script>

  <div class="avatarChoices">${['😊','😀','😎','👩','👨','🐱','🐻','🌻','💼','🧾'].map(a=>`<button class="avatarChoice" onclick="setAvatar('${a}')">${a}</button>`).join('')}</div>
  <div><span>📷 自定义头像图片</span><button class="btn s" onclick="$('#avatarFile').click()">选择图片</button><input id="avatarFile" type="file" accept="image/*" hidden onchange="setAvatarFile(this.files[0])"></div>
  <div><span>🎨 外观主题</span><select class="fi" style="width:auto" onchange="S.theme=this.value;applyTheme();save()"><option value="system" ${S.theme=='system'?'selected':''}>跟随系统</option><option value="light" ${S.theme=='light'?'selected':''}>浅色</option><option value="dark" ${S.theme=='dark'?'selected':''}>深色</option></select></div>
  <div><span>✨ 页面动画</span><button class="sw ${S.animations!==false?'on':''}" onclick="S.animations=!(S.animations!==false);save();render()" aria-label="切换动画"></button></div></div>
  <h2>记账与项目</h2><div class="menu">
  <div><span>💰 月度预算（元）</span><input class="fi" style="width:120px;text-align:right" type="number" inputmode="decimal" min="0" value="${S.budget}" onchange="S.budget=Math.max(0,+this.value||0);save();toast('预算已更新')"></div>
  <div><span>🔔 待提交提醒</span><button class="sw ${S.remind?'on':''}" onclick="S.remind=!S.remind;save();render()" aria-label="切换提醒"></button></div>
  <div><span>📂 自定义项目 (${(S.prjs||[]).length})</span><button class="btn s" style="padding:8px" onclick="manageProjects()">管理</button></div></div>
  <h2>数据管理</h2><div class="menu">
  <div onclick="exportCSV()"><span>📤 导出 CSV（复制到剪贴板）</span>›</div>
  <div onclick="askConfirm('确定清空所有记录？此操作无法撤销。',()=>{S.recs=[];save();render();toast('所有记录已清空')})"><span style="color:#E5484D">🗑️ 清空所有记录</span>›</div></div>
  <p class="footnote">v1.1.1 · 数据只保存在本机，换设备不会自动同步。更新前建议先导出备份。</p>`}
function applyTheme(){const choice=S.theme||'system',dark=choice==='dark'||(choice==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#151725':'#F5F6FB'}
function setAvatar(a){S.avatar=a;save();render();toast('头像已更新')}
function setAvatarFile(f){if(!f)return;if(!f.type.startsWith('image/'))return toast('请选择图片');if(f.size>10*1024*1024)return toast('图片不能超过10MB');const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const ctx=c.getContext('2d');const side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);S.avatar=c.toDataURL('image/jpeg',.75);save();render();toast('头像已更新')};img.onerror=()=>toast('图片无法读取');img.src=fr.result};fr.readAsDataURL(f)}
function manageProjects(){const ls=(S.prjs||[]).map((v,i)=>`<div class="kv"><span>${esc(v)}</span><button class="btn d" style="padding:6px 10px" onclick="removeProject(${i})">删除</button></div>`).join('');$('#sheet').innerHTML=`<h3>项目管理 <a onclick="closeSheet()">✕</a></h3><p style="color:var(--sub)">新增的项目下次记账仍可选择；删除项目不会删除历史账目。</p>${ls||'<div class="empty">还没有自定义项目</div>'}<div class="row"><input class="fi" id="projectName" maxlength="30" placeholder="输入项目名称"><button class="btn" onclick="createProject()">添加</button></div>`;$('#mask').classList.add('on')}
function createProject(){const v=$('#projectName').value.trim();if(!v)return toast('请输入项目名称');if(prjs().includes(v))return toast('项目已存在');S.prjs.push(v);save();manageProjects();toast('项目已添加')}
function removeProject(i){const v=S.prjs[i];askConfirm('删除项目「'+v+'」？历史记录不受影响。',()=>{S.prjs.splice(i,1);save();manageProjects()})}
function askConfirm(message,onYes){confirmAction=onYes;$('#confirmText').textContent=T(message);$('#confirmMask').classList.add('on')}
let confirmAction=null;
function closeConfirm(ok=false){$('#confirmMask').classList.remove('on');const action=confirmAction;confirmAction=null;if(ok&&action)action()}
function exportCSV(){const t=['日期','事由','分类','金额','项目','支付方式','发票','状态'].map(T).join(',')+'\n'+S.recs.map(r=>[r.date,'"'+r.title+'"',T(CATS[r.cat][0]),r.amt,T(r.prj),T(r.pay),T((r.atts||[]).length?'有':'无'),T(ST[r.st][0])].join(',')).join('\n');
 try{navigator.clipboard.writeText(t).then(()=>toast('已复制 CSV，可粘贴到表格'),()=>toast('复制失败，请重试'))}catch(e){toast('当前环境无法复制')}}
function clearData(){askConfirm('确定清空所有记录？',()=>{S.recs=[];save();render()})}
let F={};
function openAdd(id,cam){const r=id?S.recs.find(x=>x.id==id):null;F=r?{...r,atts:[...(r.atts||[])]}:{id:0,title:'',amt:'',cat:1,date:ago(0),pay:'微信',prj:'日常',inv:false,note:'',atts:[]};$('#sheet').scrollTop=0;sheetAdd(!!r);if(cam)setTimeout(()=>$('#up').scrollIntoView({block:'center'}),60)}
function sheetAdd(edit){const st0=$('#sheet').scrollTop;const w=(arr,k)=>arr.map((x,i)=>`<button class="chip ${F[k]==x?'on':''}" style="background:${F[k]==x?'':'#F5F6FB'}" onclick="F.${k}=${k=='prj'?'prjs()':'PAY'}[${i}];sheetAdd(${edit})">${esc(x)}</button>`).join('');
 $('#sheet').innerHTML=`<h3><span>${edit?'编辑报销':'记一笔'}</span><a onclick="closeSheet()" style="color:var(--sub)">✕</a></h3>
 <label>金额（元）</label><input class="fi amt" id="fa" type="number" inputmode="decimal" placeholder="0.00" value="${F.amt}" oninput="F.amt=this.value">
 <label>分类</label><div class="cg">${CATS.map((c,i)=>`<button class="${F.cat==i?'on':''}" onclick="F.cat=${i};sheetAdd(${edit})"><i>${c[1]}</i>${c[0]}</button>`).join('')}</div>
 <label>事由</label><input class="fi" placeholder="例如：客户午餐" value="${esc(F.title)}" oninput="F.title=this.value">
 <label>日期</label><input class="fi" type="date" value="${F.date}" onchange="F.date=this.value">
 <label>所属项目<span style="float:right">共 ${prjs().length} 个，可自定义</span></label><div class="wrap">${w(prjs(),'prj')}</div><div class="row" style="gap:8px;margin-top:10px"><input class="fi" id="np" maxlength="12" placeholder="没有合适的？自定义项目名称"><button class="btn s" style="padding:11px 14px;flex:none" onclick="addPrj()">添加</button></div>
 <label>支付方式</label><div class="wrap">${w(PAY,'pay')}</div>
 <label id="up">上传票据<span style="float:right">${F.atts.length} 个附件</span></label><button class="drop" onclick="$('#fi').click()">🖼️ 上传票据图片（可多选）</button><input id="fi" type="file" accept="image/*" multiple hidden onchange="addImgs(this.files)"><div class="row" style="gap:8px;margin-top:10px"><input class="fi" id="lk" placeholder="或粘贴票据链接（电子发票、网盘等）"><button class="btn s" style="padding:11px 14px;flex:none" onclick="addLink()">添加</button></div>${F.atts.length?`<div class="atts">${F.atts.map((a,i)=>att(a,i,1)).join('')}</div>`:''}
 <label>备注</label><input class="fi" placeholder="选填" value="${esc(F.note)}" oninput="F.note=this.value">
 <div class="act"><button class="btn" onclick="saveAdd()">保存</button></div>`;$('#mask').classList.add('on');$('#sheet').scrollTop=st0}
function saveAdd(){const a=parseFloat(F.amt);if(!(a>0))return toast('请输入有效金额');
 const t=F.title.trim()||T(CATS[F.cat][0])+T('费用');
 if(F.id){const r=S.recs.find(x=>x.id==F.id);Object.assign(r,F,{amt:a,title:t,inv:F.atts.length>0})}else S.recs.push({...F,id:Date.now(),amt:a,title:t,inv:F.atts.length>0,st:'draft'});
 save();closeSheet();render();toast('已保存')}
function att(a,i,rm,rid){const x=rm?`<b class="x" onclick="F.atts.splice(${i},1);sheetAdd(!!F.id)">✕</b>`:'';
 if(a.t=='img')return `<div class="at" ${rm?'':`onclick="viewImg(${rid},${i})"`}><img src="${a.d}" alt="票据图片">${x}</div>`;
 let h='链接';try{h=new URL(a.u).hostname}catch(e){}
 return rm?`<div class="at lk"><span>🔗</span>${esc(h)}${x}</div>`:`<a class="at lk" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer"><span>🔗</span>${esc(h)}</a>`}
function viewImg(rid,i){$('#lbi').src=S.recs.find(r=>r.id==rid).atts[i].d;$('#lb').classList.add('on')}
function addImgs(fs){[...fs].forEach(f=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.atts.push({t:'img',d:c.toDataURL('image/jpeg',.7)});sheetAdd(!!F.id)};im.onerror=()=>toast('图片无法读取');im.src=rd.result};rd.readAsDataURL(f)})}
function addLink(){const v=$('#lk').value.trim();if(!v)return toast('请先粘贴链接');let u;try{u=new URL(/^https?:\/\//i.test(v)?v:'https://'+v);if(!/^https?:$/.test(u.protocol))throw 0}catch(e){return toast('链接格式不正确')}F.atts.push({t:'link',u:u.href});sheetAdd(!!F.id)}
function addPrj(){const v=$('#np').value.trim();if(!v)return toast('请输入项目名称');if(!prjs().includes(v)){S.prjs=S.prjs||[];S.prjs.push(v);save()}F.prj=v;sheetAdd(!!F.id)}
function closeSheet(){$('#mask').classList.remove('on')}
function setSt(id,s){S.recs.find(r=>r.id==id).st=s;save();closeSheet();render();toast('状态已更新：'+ST[s][0])}
function del(id){askConfirm('删除这条记录？',()=>{S.recs=S.recs.filter(r=>r.id!=id);save();closeSheet();render()})}
function openDetail(id){const r=S.recs.find(x=>x.id==id),c=CATS[r.cat],s=ST[r.st];
 const lv={draft:0,sub:1,paid:2,rej:1}[r.st];
 const st=`<div class="steps"><div class="ok"><i></i>已记录</div><div class="${lv>=1?(r.st=='rej'?'no':'ok'):''}"><i></i>${r.st=='rej'?'已驳回':'审批中'}</div><div class="${lv>=2?'ok':''}"><i></i>已报销</div></div>`;
 const B={draft:`<button class="btn" onclick="setSt(${id},'sub')">提交报销</button><button class="btn s" onclick="closeSheet();openAdd(${id})">编辑</button>`,sub:`<button class="btn g" onclick="setSt(${id},'paid')">标记已报销</button><button class="btn d" onclick="setSt(${id},'rej')">驳回</button><button class="btn s" onclick="setSt(${id},'draft')">撤回</button>`,paid:`<button class="btn s" onclick="setSt(${id},'draft')">撤回到待提交</button>`,rej:`<button class="btn" onclick="setSt(${id},'draft')">修改后重新提交</button><button class="btn s" onclick="closeSheet();openAdd(${id})">编辑</button>`}[r.st];
 $('#sheet').innerHTML=`<h3><span></span><a onclick="closeSheet()" style="color:var(--sub)">✕</a></h3><div style="text-align:center"><div class="ic" style="background:${c[2]}22;margin:0 auto 8px;width:56px;height:56px;font-size:28px">${c[1]}</div><b style="font-size:30px">${money(r.amt)}</b><div><span class="tag" style="color:${s[1]};background:${s[2]}">${s[0]}</span></div></div>${st}
 <div class="kv"><span>事由</span><span>${esc(r.title)}</span></div><div class="kv"><span>分类</span><span>${c[0]}</span></div><div class="kv"><span>日期</span><span>${r.date}</span></div><div class="kv"><span>项目</span><span>${r.prj}</span></div><div class="kv"><span>支付方式</span><span>${r.pay}</span></div><div class="kv"><span>票据</span><span>${(r.atts||[]).length?r.atts.length+' 个附件':'未附'}</span></div>${(r.atts||[]).length?`<div class="atts" style="margin-bottom:6px">${r.atts.map((a,i)=>att(a,i,0,r.id)).join('')}</div>`:''}${r.note?`<div class="kv"><span>备注</span><span>${esc(r.note)}</span></div>`:''}
 <div class="act">${B}<button class="btn d" style="flex:0 0 auto" onclick="del(${id})">删除</button></div>`;$('#mask').classList.add('on')}
function render(){$('#main').innerHTML={home,list,stats,me,settings}[S.tab]();
 const n=[['home','🏠','首页'],['list','🧾','记录'],['add','＋',''],['stats','📊','统计'],['me','👤','我的']];
 if(!$('#nav').children.length)$('#nav').innerHTML=n.map(x=>x[0]=='add'?`<button class="fab" onclick="openAdd()" aria-label="记一笔"><span class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>`:`<button class="${S.tab==x[0]?'on':''}" onclick="go('${x[0]}')" data-t="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('');document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab))}
const VERSION='1.1.1';let updateReady=false;
function showUpdate(){updateReady=true;$('#updateBar').classList.add('on')}
async function checkUpdate(){if(!/^https?:/.test(location.protocol))return;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j.version&&j.version!==VERSION)showUpdate();if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}}catch(e){}}
async function updateApp(){if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}}location.reload()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>checkUpdate()).catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});window.addEventListener('focus',checkUpdate);
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')applyTheme()})}
render();anim();
</script></body></html>
